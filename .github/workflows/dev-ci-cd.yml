name: Dev CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-dev-image:
    name: Build And Push Dev Image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.prep.outputs.image }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Dependencies
        run: pip install --no-cache-dir -r requirements.txt

      # Lightweight lint gate until a project linter config is added.
      - name: Lint Python Source
        run: python -m compileall app

      - name: Run Unit Tests
        shell: bash
        run: |
          if find app -type f \( -name 'test*.py' -o -name '*_test.py' \) | grep -q .; then
            python -m unittest discover -s app -p 'test*.py'
          else
            echo "No unit tests found. Skipping test execution."
          fi

      - name: Prepare Image Metadata
        id: prep
        shell: bash
        run: |
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE_NAME="${GITHUB_REPOSITORY#*/}"
          IMAGE_NAME="${IMAGE_NAME,,}"

          echo "owner_lc=$OWNER_LC" >> "$GITHUB_OUTPUT"
          echo "image_name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$OWNER_LC/$IMAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Generate Docker Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.prep.outputs.image }}
          tags: |
            type=raw,value=dev
            type=raw,value=${{ github.sha }}

      - name: Log In To GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build And Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-to-dev-server:
    name: Deploy To Dev Server
    runs-on: ubuntu-latest
    needs: build-and-push-dev-image

    steps:
      - name: Deploy Latest Dev Image Via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_URI: ${{ needs.build-and-push-dev-image.outputs.image }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          CONTAINER_NAME: ${{ vars.DEV_CONTAINER_NAME }}
          ENV_FILE_PATH: ${{ vars.DEV_ENV_FILE_PATH }}
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          port: ${{ secrets.DEV_PORT }}
          script_stop: true
          envs: IMAGE_URI,GHCR_USERNAME,GHCR_PASSWORD,CONTAINER_NAME,ENV_FILE_PATH
          script: |
            set -eu

            IMAGE_DEV_TAG="${IMAGE_URI}:dev"
            PREVIOUS_IMAGE="$(docker inspect --format='{{.Config.Image}}' "${CONTAINER_NAME}" 2>/dev/null || true)"

            echo "${GHCR_PASSWORD}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin
            docker pull "${IMAGE_DEV_TAG}"

            docker rm -f "${CONTAINER_NAME}" 2>/dev/null || true
            docker run -d \
              --name "${CONTAINER_NAME}" \
              --restart unless-stopped \
              --env-file "${ENV_FILE_PATH}" \
              "${IMAGE_DEV_TAG}"

            sleep 10

            if docker ps --filter "name=^/${CONTAINER_NAME}$" --filter "status=running" --format '{{.Names}}' | grep -qx "${CONTAINER_NAME}"; then
              exit 0
            fi

            if [ -n "${PREVIOUS_IMAGE}" ]; then
              docker rm -f "${CONTAINER_NAME}" 2>/dev/null || true
              docker run -d \
                --name "${CONTAINER_NAME}" \
                --restart unless-stopped \
                --env-file "${ENV_FILE_PATH}" \
                "${PREVIOUS_IMAGE}"
            fi

            exit 1
